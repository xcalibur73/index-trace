[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "index-trace"
version = "1.1.0"
description = "Google Search Console indexing diagnostic and RFC 9309 crawler collision tracer"
readme = "README.md"
authors = [
  { name = "xcalibur73" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Quality Assurance"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0"
]

[project.scripts]
index-trace = "index_trace.cli:main"

[project.urls]
"Homepage" = "https://github.com/xcalibur73/index-trace"
"Cloud Engine" = "https://webaudits.pro/tools/index-trace"
"Bug Tracker" = "https://github.com/xcalibur73/index-trace/issues"
