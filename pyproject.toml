[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "index-trace"
version = "1.2.3"
description = "Google Search Console indexing diagnostic and RFC 9309 crawler collision tracer"
readme = "README.md"
authors = [
  { name = "Web Audits Engineering Team" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Free For Educational Use",
    "License :: Free For Non-commercial Use",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Quality Assurance"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0"
]

[project.scripts]
index-trace = "index_trace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["index_trace*"]
exclude = ["assets*", "tests*"]

[project.urls]
"Homepage" = "https://webaudits.pro/tools/index-trace"
"Cloud Engine" = "https://webaudits.pro/tools/index-trace"
